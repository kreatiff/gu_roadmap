services:
  app:
    image: ghcr.io/kreatiff/gu_roadmap:latest
    container_name: gu_roadmap
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - gu_roadmap_data:/app/server/data
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=Australia/Brisbane
      # Host has no IPv6 route and Node's default 250ms per-address timeout is too
      # short for the IPv4 handshake to Google, which breaks OIDC discovery (ETIMEDOUT).
      - NODE_OPTIONS=--no-network-family-autoselection --dns-result-order=ipv4first
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-gu-roadmap}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - DEV_AUTH_ENABLED=${DEV_AUTH_ENABLED:-false}
      - COSMOS_ENDPOINT=${COSMOS_ENDPOINT}
      - COSMOS_KEY=${COSMOS_KEY}
      - COSMOS_DATABASE_ID=${COSMOS_DATABASE_ID:-gu_roadmap}

volumes:
  gu_roadmap_data:
